[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpubalance"
version = "0.1.0"
description = "Launch-time workload balancing for Linux machines with GPUs from different vendors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Operating System :: POSIX :: Linux"]

[project.scripts]
gpubalance = "gpubalance.cli:main"

[tool.setuptools]
packages = ["gpubalance"]
